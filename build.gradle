plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.uber'
version = '1.0.0-SNAPSHOT'
mainClassName = 'com.uber.server.Main'

repositories {
    mavenCentral()
}

java {
    withSourcesJar()
    withJavadocJar()
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

dependencies {
    // Database Connection Pool
    // https://mvnrepository.com/artifact/com.zaxxer/HikariCP
    implementation group: 'com.zaxxer', name: 'HikariCP', version: '5.1.0'

    // MySQL Connector
    // https://mvnrepository.com/artifact/com.mysql/mysql-connector-j
    implementation group: 'com.mysql', name: 'mysql-connector-j', version: '8.2.0'

    // Logging
    // https://mvnrepository.com/artifact/org.slf4j/slf4j-api
    implementation group: 'org.slf4j', name: 'slf4j-api', version: '2.0.9'
    
    // https://mvnrepository.com/artifact/ch.qos.logback/logback-classic
    implementation group: 'ch.qos.logback', name: 'logback-classic', version: '1.4.14'
    
    // https://mvnrepository.com/artifact/ch.qos.logback/logback-core
    implementation group: 'ch.qos.logback', name: 'logback-core', version: '1.4.14'

    // Testing
    // https://mvnrepository.com/artifact/org.junit.jupiter/junit-jupiter-api
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: '5.10.0'
    
    // https://mvnrepository.com/artifact/org.junit.jupiter/junit-jupiter-engine
    testRuntimeOnly group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: '5.10.0'
}

// Configure the shadow jar (fat jar). Defaults to classifier "all".
// The below sets the file name to the expected output
tasks.shadowJar {
    // Produces <project.name>-<project.version>.jar (no "-all" suffix).
    archiveClassifier.set("")
    archiveFileName.set("${project.name}-${project.version}.jar")
    manifest {
        attributes 'Main-Class': mainClassName
    }
}

// Make sure start scripts use shadow jar
tasks.startScripts {
    dependsOn tasks.shadowJar
    doFirst {
        classpath = files(tasks.shadowJar.archiveFile)
    }
}

// Make distribution tasks use shadow jar
tasks.distZip {
    dependsOn tasks.shadowJar
}

tasks.distTar {
    dependsOn tasks.shadowJar
}

// Make the shadow jar the default jar artifact
artifacts {
    archives tasks.named("shadowJar")
}

// Make jar task depend on shadowJar so it's built first
tasks.jar {
    enabled = false
    dependsOn tasks.shadowJar
}
